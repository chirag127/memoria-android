name: build-apk

# Builds an instantly-installable DEBUG-signed APK and publishes it to a GitHub
# Release. Debug signing needs no keystore secret — sideload directly on any device
# (enable "install unknown apps"). Runs on push to main + manual dispatch.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (play flavor)
        run: ./gradlew :app:assemblePlayDebug --stacktrace
      - name: Locate APK
        id: apk
        run: |
          f=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "found: $f"
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="apk-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --title "Memoria debug APK $tag" \
            --notes "Instantly-installable debug APK (play flavor). Sideload: enable 'install unknown apps', open the .apk. Scaffold build — launches to placeholder; features land per ROADMAP." \
            --prerelease \
          || gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
