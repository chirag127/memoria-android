name: nightly
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Auto-format with ktlintFormat
        run: ./gradlew ktlintFormat
      - name: Commit formatting fixes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no formatting changes"
          else
            git commit -m "style: auto-format kotlin sources (ktlintFormat)"
            git pull --rebase origin main
            git push
          fi
      - name: Lint (advisory — never blocks the nightly)
        run: ./gradlew ktlintCheck detekt --stacktrace || echo "::warning::ktlint/detekt reported issues (advisory)"
      - name: Tests + build (hard gate)
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_number }}
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 14
